apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: web
        image: nginx:alpine
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        envFrom:
          - configMapRef:
               name: orders-config
        env:
          - name: API_TOKEN
            valueFrom:
               secretKeyRef:
                    name: api-token
                    key: API_TOKEN

        livenessProbe:
          httpGet:
            path: / 
            port: 80
            
        readinessProbe:
          httpGet:
            path: /
            port: 80